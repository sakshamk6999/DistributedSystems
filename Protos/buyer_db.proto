syntax = "proto3";
import "google/protobuf/wrappers.proto";
option java_multiple_files = true;
option java_package = "io.grpc.examples.buyerdbproto";
option java_outer_classname = "BuyerDBProto";
option objc_class_prefix = "BUYERDB";

package buyerdbproto;

service BuyerDB {
    // Registers the user for the service
    rpc Register(RegisterRequest) returns (RegisterResponse) {}
    // Logins the user for the service
    rpc Login(LoginRequest) returns (UserResponse) {}
    // Logsout the user for the service
    rpc Logout(UserRequest) returns (google.protobuf.BoolValue) {}
}

enum Status {
    OK = 0;
    ERROR = 1;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
    string name = 3;
}

message RegisterResponse {
    Status status = 1;
    string message = 2;
    string id = 3;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message UserRequest {
    string session_id = 1;
}

message UserResponse {
    Status status = 1;
    string message = 2;
    string session_id = 3;
}