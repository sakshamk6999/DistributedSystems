syntax = "proto3";
import "customer_db.proto";

message GeneralMessage {
    oneof message_type {
      RequestMessage request_message = 1;
      ServiceMessage service_message = 2;
    }
}

message RequestMessage {
    int32 sender_id = 1;
    int32 local_sequence_num = 2;
    oneof request_body {
        customerdbproto.LoginRequest login_request = 3;
        customerdbproto.RegisterRequest register_request = 4;
    }
    RequestMetadata metadata = 5;
}


message RequestMetadata {
    int32 global_sequence = 1;

}

message ServiceMessage {
    int32 source_id = 1;
    int32 request_id = 2;
    int32 global_id = 3;
    int32 sender_id = 4;
    ServiceMetadata metadata = 5;
}

message ServiceMetadata {
    int32 last_delivered_seq = 1;
}